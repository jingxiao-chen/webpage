<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f7f5">
  <title>Jingxiao Chen | Under Construction</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202522;
      --muted: #747b76;
      --accent: #587568;
      --paper: #f7f7f5;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 22px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      text-align: center;
    }
    .mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 34px;
      display: grid;
      place-items: center;
      border: 1px solid #d8ded9;
      border-radius: 50%;
      color: var(--accent);
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.06em;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 58px);
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1.12;
    }
    .message {
      max-width: 440px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }
    .rule {
      width: 42px;
      height: 1px;
      margin: 34px auto;
      background: #cbd4ce;
    }
    .name {
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
    }
    footer {
      margin-top: 10px;
      color: #929994;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">JC</div>
    <p class="eyebrow">Website update in progress</p>
    <h1>Under<br>Construction</h1>
    <p class="message">This website is temporarily unavailable while I work on a new version. Please check back soon.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="name">JINGXIAO CHEN</div>
    <footer>Thank you for your patience.</footer>
  </main>
</body>
</html>
